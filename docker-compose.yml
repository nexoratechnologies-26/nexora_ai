version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - nexora_data:/backend/nexora_data
      - chroma_db:/backend/chroma_db
    environment:
      - DATABASE_URL=sqlite:///./nexora_data/nexora_local.db
      - CHROMA_DB_DIR=./chroma_db
      - DATA_DIR=./nexora_data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  nexora_data:
  chroma_db:
